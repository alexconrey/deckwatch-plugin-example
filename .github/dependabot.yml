# Dependabot version updates. Cargo includes the SDK: Dependabot can propose a
# newer deckwatch-plugin-sdk tag for the git dependency.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Wait a few days after a release before proposing it, to avoid yanked or
    # compromised releases. Security updates bypass this.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # github-actions supports only default-days.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
