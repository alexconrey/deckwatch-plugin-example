name: Release

# Pushing a v* tag builds plugin.wasm with the pinned toolchain and publishes
# it, with its SHA-256, as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and release plugin.wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error file=Cargo.toml::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Stage plugin.wasm and SHA256SUMS
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/deckwatch_plugin_example.wasm dist/plugin.wasm
          (cd dist && sha256sum plugin.wasm > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes dist/plugin.wasm dist/SHA256SUMS
