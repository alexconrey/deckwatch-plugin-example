[package]
name = "deckwatch-plugin-example"
version = "0.1.0"
edition = "2021"

# Plugins must produce a cdylib so the WASM linker emits a proper module
# with exported functions. Don't add "rlib": with it, `cargo test` on the host
# fails to link, because extism's host imports only exist in wasm.
[lib]
crate-type = ["cdylib"]

[dependencies]
# extism PDK provides the #[plugin_fn] macro and the Json/FnResult types.
extism-pdk = "1"
# Shared types — update the git ref to pin a specific SDK release.
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
